<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa Nexus</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b0e14',
                        cardbg: '#131822',
                        accent: '#6366f1'
                    }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .manhwa-reader img { display: block; width: 100%; max-width: 800px; margin: 0 auto; height: auto; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen font-sans antialiased selection:bg-accent selection:text-white">

    <!-- HEADER / NAVEGACIÓN -->
    <header class="sticky top-0 z-40 bg-darkbg/90 backdrop-blur-md border-b border-gray-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="goHome()">
                <div class="bg-accent/10 p-2 rounded-xl border border-accent/20">
                    <i class="fa-solid fa-book-open-reader text-accent text-xl"></i>
                </div>
                <span class="font-black text-lg tracking-wider bg-gradient-to-r from-white to-gray-400 bg-clip-text text-transparent">Manhwa Nexus</span>
            </div>
            
            <nav class="flex items-center space-x-2 sm:space-x-4">
                <button onclick="goHome()" class="flex items-center space-x-1 px-3 py-2 rounded-lg text-sm font-medium text-gray-300 hover:text-white hover:bg-gray-800/60 transition">
                    <i class="fa-solid fa-house"></i>
                    <span class="hidden sm:inline">INICIO</span>
                </button>
                <button onclick="openAdminModal()" class="flex items-center space-x-1 px-3 py-2 rounded-lg text-sm font-medium bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 hover:bg-indigo-600/30 transition">
                    <i class="fa-solid fa-lock"></i>
                    <span>Panel Admin</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <!-- VISTA: INICIO -->
        <div id="home-view" class="space-y-8">
            <div class="relative overflow-hidden rounded-3xl bg-gradient-to-br from-cardbg to-[#1a2233] border border-gray-800 p-6 sm:p-10 shadow-2xl">
                <div class="relative z-10 max-w-xl">
                    <h1 class="text-2xl sm:text-4xl font-extrabold tracking-tight text-white mb-3">Bienvenido a Manhwa Nexus</h1>
                    <p class="text-sm sm:text-base text-gray-400">Explora, lee y descubre los mejores manhwas en alta calidad y con lectura vertical continua.</p>
                </div>
            </div>

            <div class="flex justify-between items-center">
                <h2 class="text-xl font-bold border-l-4 border-accent pl-3 text-white">Catálogo de Obras</h2>
                <div class="text-xs text-gray-400" id="manhwa-count">Cargando...</div>
            </div>

            <!-- Listado de Manhwas -->
            <div id="manhwa-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 sm:gap-6">
                <!-- Se cargan dinámicamente con JS -->
            </div>
        </div>

        <!-- VISTA: DETALLE DE MANHWA Y CAPÍTULOS -->
        <div id="detail-view" class="hidden space-y-6">
            <button onclick="goHome()" class="inline-flex items-center space-x-2 text-sm text-gray-400 hover:text-white bg-cardbg border border-gray-800 px-4 py-2 rounded-xl transition">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Volver al inicio</span>
            </button>
            <div id="manhwa-detail-content" class="bg-cardbg border border-gray-800 p-6 rounded-3xl">
                <!-- Info y Capítulos cargados por JS -->
            </div>
        </div>

        <!-- VISTA: LECTOR DE CAPÍTULO -->
        <div id="reader-view" class="hidden space-y-6 max-w-3xl mx-auto">
            <div class="flex items-center justify-between bg-cardbg border border-gray-800 p-4 rounded-2xl sticky top-20 z-30 shadow-lg">
                <button onclick="backToDetail()" class="text-sm text-gray-400 hover:text-white flex items-center space-x-1">
                    <i class="fa-solid fa-arrow-left"></i> <span>Atrás</span>
                </button>
                <h2 id="reader-title" class="font-bold text-sm sm:text-base text-white truncate max-w-[200px] sm:max-w-md text-center"></h2>
                <div class="w-16"></div>
            </div>
            <div id="reader-images" class="manhwa-reader bg-black rounded-2xl overflow-hidden shadow-2xl">
                <!-- Imágenes de la galería subidas -->
            </div>
        </div>

        <!-- VISTA: PANEL DE ADMINISTRACIÓN -->
        <div id="admin-view" class="hidden space-y-8 max-w-4xl mx-auto">
            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                <h2 class="text-2xl font-black text-white flex items-center space-x-2">
                    <i class="fa-solid fa-gauge-high text-accent"></i>
                    <span>Panel de Administración</span>
                </h2>
                <button onclick="goHome()" class="text-sm bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2 rounded-xl transition">Cerrar Panel</button>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Añadir Manhwa con Portada de la Galería -->
                <div class="bg-cardbg border border-gray-800 p-6 rounded-2xl space-y-4">
                    <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-plus text-accent mr-2"></i> Nuevo Manhwa</h3>
                    <form onsubmit="handleCreateManhwa(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Título</label>
                            <input type="text" id="new-manhwa-title" required class="w-full bg-darkbg border border-gray-800 rounded-xl p-2.5 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Sinopsis</label>
                            <textarea id="new-manhwa-synopsis" rows="2" class="w-full bg-darkbg border border-gray-800 rounded-xl p-2.5 text-sm text-white"></textarea>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Imagen de Portada (Desde tu galería)</label>
                            <input type="file" id="new-manhwa-cover-file" accept="image/*" required class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-accent file:text-white hover:file:bg-accent/80 cursor-pointer bg-darkbg border border-gray-800 rounded-xl">
                        </div>
                        <button type="submit" id="btn-save-manhwa" class="w-full bg-accent hover:bg-accent/90 text-white font-medium py-2.5 rounded-xl transition text-sm">Guardar Manhwa</button>
                    </form>
                </div>

                <!-- Añadir Capítulo seleccionando páginas de la Galería -->
                <div class="bg-cardbg border border-gray-800 p-6 rounded-2xl space-y-4">
                    <h3 class="text-lg font-bold text-white"><i class="fa-solid fa-layer-group text-accent mr-2"></i> Nuevo Capítulo</h3>
                    <form onsubmit="handleCreateChapter(event)" class="space-y-3">
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Seleccionar Manhwa</label>
                            <select id="admin-manhwa-select" required class="w-full bg-darkbg border border-gray-800 rounded-xl p-2.5 text-sm text-white">
                                <!-- Opciones cargadas por JS -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Número de Capítulo (Ej: Capítulo 1)</label>
                            <input type="text" id="new-chap-number" required placeholder="Capítulo 1" class="w-full bg-darkbg border border-gray-800 rounded-xl p-2.5 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-400 mb-1">Páginas del Capítulo (Selecciona varias de tu galería)</label>
                            <input type="file" id="new-chap-files" multiple accept="image/*" required class="w-full text-xs text-gray-400 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-accent file:text-white hover:file:bg-accent/80 cursor-pointer bg-darkbg border border-gray-800 rounded-xl">
                        </div>
                        <button type="submit" id="btn-save-chap" class="w-full bg-accent hover:bg-accent/90 text-white font-medium py-2.5 rounded-xl transition text-sm">Subir Capítulo</button>
                    </form>
                </div>
            </div>
        </div>

    </main>

    <!-- MODAL DE LOGIN ADMIN (VACÍO Y MANUAL) -->
    <div id="login-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center z-50 hidden p-4">
        <div class="bg-cardbg border border-gray-800 p-6 rounded-3xl w-full max-w-sm shadow-2xl space-y-4">
            <h3 class="text-xl font-bold text-white">Acceso Administrador</h3>
            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Correo electrónico</label>
                    <input type="email" id="admin-email" required autocomplete="off" placeholder="Escribe tu correo..." class="w-full bg-darkbg border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Contraseña</label>
                    <input type="password" id="admin-pass" required autocomplete="new-password" placeholder="Escribe tu contraseña..." class="w-full bg-darkbg border border-gray-800 rounded-xl p-3 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div class="flex space-x-3 pt-2">
                    <button type="button" onclick="closeAdminModal()" class="w-1/2 bg-gray-800 hover:bg-gray-700 text-gray-300 font-medium py-2.5 rounded-xl transition text-sm">Cancelar</button>
                    <button type="submit" class="w-1/2 bg-accent hover:bg-accent/90 text-white font-medium py-2.5 rounded-xl transition text-sm">Ingresar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE SUPABASE Y FUNCIONALIDAD -->
    <script>
        // Recuerda colocar tus credenciales reales de Supabase aquí abajo
        const SUPABASE_URL = 'https://llcnufcpooupwlnnusrx.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_diOvYF-2_ZR0dmNOXgI2wQ_83kSB2YS';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentManhwaId = null;

        window.addEventListener('DOMContentLoaded', () => {
            loadManhwas();
        });

        function goHome() {
            document.getElementById('home-view').classList.remove('hidden');
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');
            window.scrollTo(0,0);
            loadManhwas();
        }

        async function loadManhwas() {
            const grid = document.getElementById('manhwa-grid');
            grid.innerHTML = '<p class="text-gray-400 col-span-full text-center py-8 text-sm">Cargando catálogo...</p>';

            const { data, error } = await supabaseClient.from('manhwas').select('*');

            if (error || !data || data.length === 0) {
                grid.innerHTML = '<p class="text-gray-500 col-span-full text-center py-8 text-sm">No hay obras publicadas todavía.</p>';
                document.getElementById('manhwa-count').innerText = '0 Obras';
                return;
            }

            document.getElementById('manhwa-count').innerText = `${data.length} Obras`;
            grid.innerHTML = data.map(m => `
                <div onclick="showDetail('${m.id}')" class="bg-cardbg border border-gray-800 rounded-2xl overflow-hidden cursor-pointer hover:border-accent transition group flex flex-col justify-between">
                    <div class="aspect-[3/4] overflow-hidden bg-gray-900">
                        <img src="${m.cover_url || ''}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                    </div>
                    <div class="p-3">
                        <h4 class="font-bold text-sm truncate text-white">${m.title}</h4>
                        <p class="text-xs text-gray-400 line-clamp-1 mt-0.5">${m.synopsis || ''}</p>
                    </div>
                </div>
            `).join('');
        }

        async function showDetail(id) {
            currentManhwaId = id;
            document.getElementById('home-view').classList.add('hidden');
            document.getElementById('detail-view').classList.remove('hidden');
            document.getElementById('reader-view').classList.add('hidden');
            document.getElementById('admin-view').classList.add('hidden');

            const container = document.getElementById('manhwa-detail-content');
            container.innerHTML = '<p class="text-gray-400 text-center py-6 text-sm">Cargando detalles...</p>';

            const { data: manhwa } = await supabaseClient.from('manhwas').select('*').eq('id', id).single();
            const { data: chapters } = await supabaseClient.from('chapters').select('*').eq('manhwa_id', id).order('created_at', { ascending: true });

            if (!manhwa) return;

            container.innerHTML = `
                <div class="flex flex-col sm:flex-row gap-6">
                    <img src="${manhwa.cover_url}" class="w-40 h-56 object-cover rounded-2xl border border-gray-700 shadow-lg mx-auto sm:mx-0">
                    <div>
                        <h1 class="text-2xl font-bold text-white mb-2">${manhwa.title}</h1>
                        <p class="text-gray-300 text-sm leading-relaxed">${manhwa.synopsis || 'Sin sinopsis.'}</p>
                    </div>
                </div>
                <hr class="border-gray-800 my-6">
                <h3 class="text-lg font-bold text-white mb-4"><i class="fa-solid fa-list text-accent mr-2"></i> Capítulos</h3>
                <div class="space-y-2">
                    ${chapters && chapters.length > 0 ? chapters.map(ch => `
                        <div onclick="openReader('${ch.id}', '${ch.chapter_number}', '${manhwa.title}')" class="bg-darkbg border border-gray-800 hover:border-accent p-3.5 rounded-xl flex justify-between items-center cursor-pointer transition">
                            <span class="font-medium text-gray-200 text-sm">${ch.chapter_number}</span>
                            <span class="text-xs text-accent font-medium">Leer <i class="fa-solid fa-chevron-right ml-1"></i></span>
                        </div>
                    `).join('') : '<p class="text-gray-500 text-xs">No hay capítulos disponibles.</p>'}
                </div>
            `;
        }

        async function openReader(chapterId, chapterNum, manhwaTitle) {
            document.getElementById('detail-view').classList.add('hidden');
            document.getElementById('reader-view').classList.remove('hidden');
            document.getElementById('reader-title').innerText = `${manhwaTitle} - ${chapterNum}`;

            const readerImages = document.getElementById('reader-images');
            readerImages.innerHTML = '<p class="text-gray-400 text-center py-12 text-sm">Cargando páginas...</p>';

            const { data } = await supabaseClient.from('chapters').select('*').eq('id', chapterId).single();
            if (!data || !data.pages) {
                readerImages.innerHTML = '<p class="text-red-400 text-center py-12 text-sm">Error al cargar las páginas.</p>';
                return;
            }

            readerImages.innerHTML = data.pages.map(imgUrl => `<img src="${imgUrl}" loading="lazy">`).join('');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function backToDetail() {
            if (currentManhwaId) showDetail(currentManhwaId);
            else goHome();
        }

        function openAdminModal() {
            document.getElementById('admin-email').value = '';
            document.getElementById('admin-pass').value = '';
            document.getElementById('login-modal').classList.remove('hidden');
        }

        function closeAdminModal() {
            document.getElementById('login-modal').classList.add('hidden');
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-pass').value;

            // TUS DATOS DE ACCESO MANUAL
            if (email === 'pablopoichee@gmail.com' && pass === 'tupassword123') {
                closeAdminModal();
                document.getElementById('home-view').classList.add('hidden');
                document.getElementById('detail-view').classList.add('hidden');
                document.getElementById('reader-view').classList.add('hidden');
                document.getElementById('admin-view').classList.remove('hidden');
                loadAdminSelect();
            } else {
                alert('Correo o contraseña incorrectos');
            }
        }

        async function loadAdminSelect() {
            const select = document.getElementById('admin-manhwa-select');
            const { data } = await supabaseClient.from('manhwas').select('*');
            if (data) {
                select.innerHTML = data.map(m => `<option value="${m.id}">${m.title}</option>`).join('');
            }
        }

        async function handleCreateManhwa(e) {
            e.preventDefault();
            const title = document.getElementById('new-manhwa-title').value;
            const synopsis = document.getElementById('new-manhwa-synopsis').value;
            const fileInput = document.getElementById('new-manhwa-cover-file');

            if (fileInput.files.length === 0) return;

            document.getElementById('btn-save-manhwa').innerText = 'Guardando portada...';
            const cover_url = await toBase64(fileInput.files[0]);

            const { error } = await supabaseClient.from('manhwas').insert([{ title, synopsis, cover_url }]);
            document.getElementById('btn-save-manhwa').innerText = 'Guardar Manhwa';

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('¡Manhwa guardado con éxito!');
                document.getElementById('new-manhwa-title').value = '';
                document.getElementById('new-manhwa-synopsis').value = '';
                fileInput.value = '';
                loadAdminSelect();
            }
        }

        async function handleCreateChapter(e) {
            e.preventDefault();
            const manhwa_id = document.getElementById('admin-manhwa-select').value;
            const chapter_number = document.getElementById('new-chap-number').value;
            const fileInput = document.getElementById('new-chap-files');

            if (fileInput.files.length === 0) return;

            document.getElementById('btn-save-chap').innerText = 'Procesando páginas...';

            let pages = [];
            for (let file of fileInput.files) {
                const base64 = await toBase64(file);
                pages.push(base64);
            }

            const { error } = await supabaseClient.from('chapters').insert([{ manhwa_id, chapter_number, pages }]);
            document.getElementById('btn-save-chap').innerText = 'Subir Capítulo';

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('¡Capítulo subido con éxito!');
                document.getElementById('new-chap-number').value = '';
                fileInput.value = '';
            }
        }

        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>
</body>
</html>
